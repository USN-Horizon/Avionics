[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
# Check out other frameworks as well. Like cmsis?
framework = arduino
upload_protocol = dfu
upload_flags = -s 0x08000000:leave   ; reboots into your app after flashing
monitor_speed = 115200
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D HAL_PCD_MODULE_ENABLED
    -Werror # all warnings are treated as errors
    -Wall   # enable more warnings
    -I.     # make sure FreeRTOSConfig.h can be found
    -Ilib/FreeRTOS/include
    -Ilib/FreeRTOS/portable/GCC/ARM_CM4F # use arm cortex-m4f port of freeRTOS
